name: Smoke · Bondery stack

# Manual full-stack smoke drill: api and webapp at one tag, behind a real Traefik. The release
# smoke runs inside release.yml (smoke_release) and stage-images.yml (smoke_rc).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag of both images to pull from GHCR (e.g. 1.7.5)
        required: true
        type: string

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v2.40.2

      - name: Ensure dokploy-network exists
        run: docker network create dokploy-network || true

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Fetch Infisical staging secrets
        uses: ./.github/actions/shared/infisical-staging-secrets

      - name: Run release smoke
        run: |
          node deploy/bondery/scripts/smoke-release.mjs \
            --tag "${{ inputs.image_tag }}"
