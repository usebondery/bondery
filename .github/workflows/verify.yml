name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - name: Biome
        run: |
          set +e
          pnpm exec biome ci --colors=off --max-diagnostics=none --reporter=default --reporter=json --reporter-file="${RUNNER_TEMP}/biome-report.json" .
          status=$?
          set -e
          node scripts/check/biome-step-summary.mjs "${RUNNER_TEMP}/biome-report.json"
          exit "$status"

      - name: Check package imports
        run: pnpm run check:package-imports

      - name: Check injected packages stay free of generated files
        run: pnpm run check:injected-packages

      - name: Check security headers come from the shared CSP builder
        run: pnpm run check:security-headers

  env:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch git tags
        run: git fetch --tags --force

      - uses: ./.github/actions/shared/setup-pnpm

      - name: Env sync and version sync
        run: |
          status=0
          pnpm run env:check || status=1
          pnpm run check:versions || status=1
          pnpm run check:llm-plugins || status=1
          exit "$status"

  openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for OpenAPI checks
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: OpenAPI and docs checks
        run: |
          status=0
          pnpm run check:openapi || status=1
          pnpm run check:docs || status=1
          exit "$status"

  schema-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for schema contracts
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: Schema contracts and API error checks
        run: |
          status=0
          pnpm run check:contracts || status=1
          pnpm run check:api-errors || status=1
          exit "$status"

  translations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - name: Translation checks
        run: pnpm run check:i18n

  # Ruleset context stays `contracts`. This job fails when any parallel check fails.
  contracts:
    needs: [env, openapi, schema-contracts, translations]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require parallel contract checks
        run: |
          set -euo pipefail
          echo "env=${{ needs.env.result }}"
          echo "openapi=${{ needs.openapi.result }}"
          echo "schema-contracts=${{ needs.schema-contracts.result }}"
          echo "translations=${{ needs.translations.result }}"
          test "${{ needs.env.result }}" = "success"
          test "${{ needs.openapi.result }}" = "success"
          test "${{ needs.schema-contracts.result }}" = "success"
          test "${{ needs.translations.result }}" = "success"

  types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for typecheck
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: Build helpers for root scripts
        run: pnpm --filter @bondery/helpers run build

      - name: Typecheck
        run: pnpm run check:types

  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for tests
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: Build helpers for root scripts
        run: pnpm --filter @bondery/helpers run build

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1

      - name: Validate Bondery deploy compose
        run: |
          cp deploy/bondery/.env.example deploy/bondery/.env
          node deploy/bondery/scripts/check-compose.mjs

      - name: Webapp runtime config tests
        run: pnpm run test:webapp:runtime-config

      - name: API sync unit tests
        run: pnpm run test:api:sync

      # Assert the CSP and CORS headers the proxies emit. A wrong `config`
      # export name or a drifted allowlist produces no error and no header, so
      # these run on every pull request. They need the built `@bondery/helpers`.
      - name: Website CSP and proxy tests
        run: pnpm --filter website run test:proxy

      - name: Webapp CSP and proxy tests
        run: pnpm --filter webapp run test:proxy

      - name: Webapp shell list tests
        run: pnpm --filter webapp run test:shell

      - name: Website discovery CORS tests
        run: pnpm --filter website run test:cors

  website-docker-build:
    needs: [lint, types, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            website:
              - apps/website/**
              - packages/openapi-spec/**
              - docs/**
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.website
              - apps/website/Dockerfile
              - .github/actions/shared/**
              - .github/workflows/verify.yml
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml
              - deploy/ops/**

      - name: Skip website docker build
        if: steps.filter.outputs.website != 'true'
        run: echo "No website docker paths changed — skipping build"

      - uses: ./.github/actions/shared/docker-verify-build
        if: steps.filter.outputs.website == 'true'
        with:
          dockerfile: apps/website/Dockerfile
          dockerignore_file: .dockerignore.website
          image_name: ghcr.io/usebondery/website
          git_sha: ${{ github.sha }}
          build_args: |
            BONDERY_INFRA_GIT_SHA=${{ github.sha }}
            BONDERY_INFRA_VERSION=verify
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}
          cache_scope: website

  api-docker-build:
    needs: [lint, types, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - apps/api/**
              - packages/**
              - scripts/**
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.api
              - .github/actions/shared/**
              - .github/workflows/verify.yml
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml

      - name: Skip api docker build
        if: steps.filter.outputs.api != 'true'
        run: echo "No api docker paths changed — skipping build"

      - uses: ./.github/actions/shared/docker-verify-build
        if: steps.filter.outputs.api == 'true'
        with:
          dockerfile: apps/api/Dockerfile
          dockerignore_file: .dockerignore.api
          image_name: ghcr.io/usebondery/api
          git_sha: ${{ github.sha }}
          build_args: |
            BONDERY_INFRA_GIT_SHA=${{ github.sha }}
            BONDERY_INFRA_VERSION=verify
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}
          cache_scope: api

  webapp-docker-build:
    needs: [lint, types, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            webapp:
              - apps/webapp/**
              - packages/**
              - scripts/**
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.webapp
              - .github/actions/shared/**
              - .github/workflows/verify.yml
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml

      - name: Skip webapp docker build
        if: steps.filter.outputs.webapp != 'true'
        run: echo "No webapp docker paths changed — skipping build"

      - uses: ./.github/actions/shared/docker-verify-build
        if: steps.filter.outputs.webapp == 'true'
        with:
          dockerfile: apps/webapp/Dockerfile
          dockerignore_file: .dockerignore.webapp
          image_name: ghcr.io/usebondery/webapp
          git_sha: ${{ github.sha }}
          build_args: |
            BONDERY_INFRA_GIT_SHA=${{ github.sha }}
            BONDERY_INFRA_VERSION=verify
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}
          cache_scope: webapp
