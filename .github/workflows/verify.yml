name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.6

      - name: Biome
        run: biome ci .

      - name: Check package imports
        run: pnpm run check:package-imports

  contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch git tags
        run: git fetch --tags --force

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for contract checks
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: Check env sync (examples + turbo)
        run: pnpm run env:check

      - name: Check product version sync
        run: pnpm run check:versions

      - name: Docs checks
        run: pnpm run check:docs

      - name: OpenAPI checks
        run: pnpm run check:openapi

      - name: Schema contracts
        run: pnpm run check:contracts

      - name: Translation checks
        run: pnpm run check:i18n

      - name: API error checks
        run: pnpm run check:api-errors

  types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for typecheck
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: Build helpers for root scripts
        run: pnpm --filter @bondery/helpers run build

      - name: Typecheck
        run: pnpm run check:types

  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/setup-pnpm

      - uses: ./.github/actions/shared/turbo-remote-cache
        with:
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}

      - name: Build API workspace deps for tests
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:54322/bondery
        run: pnpm -r --filter "api^..." run build

      - name: Build helpers for root scripts
        run: pnpm --filter @bondery/helpers run build

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1

      - name: Validate Bondery deploy compose
        run: |
          cp deploy/bondery/.env.example deploy/bondery/.env
          node deploy/bondery/scripts/check-compose.mjs

      - name: Webapp runtime config tests
        run: pnpm run test:webapp:runtime-config

      - name: API sync unit tests
        run: pnpm run test:api:sync

  website-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            website:
              - apps/website/**
              - packages/openapi-spec/**
              - docs/**
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.website
              - apps/website/Dockerfile
              - .github/actions/shared/**
              - .github/workflows/verify.yml
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml
              - deploy/ops/**

      - name: Skip website docker build
        if: steps.filter.outputs.website != 'true'
        run: echo "No website docker paths changed — skipping build"

      - uses: ./.github/actions/shared/docker-verify-build
        if: steps.filter.outputs.website == 'true'
        with:
          dockerfile: apps/website/Dockerfile
          dockerignore_file: .dockerignore.website
          image_name: ghcr.io/usebondery/website
          git_sha: ${{ github.sha }}
          build_args: |
            BONDERY_INFRA_GIT_SHA=${{ github.sha }}
            BONDERY_INFRA_VERSION=verify
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}
          cache_scope: website

  api-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - apps/api/**
              - packages/**
              - scripts/**
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.api
              - .github/actions/shared/**
              - .github/workflows/verify.yml
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml

      - name: Skip api docker build
        if: steps.filter.outputs.api != 'true'
        run: echo "No api docker paths changed — skipping build"

      - uses: ./.github/actions/shared/docker-verify-build
        if: steps.filter.outputs.api == 'true'
        with:
          dockerfile: apps/api/Dockerfile
          dockerignore_file: .dockerignore.api
          image_name: ghcr.io/usebondery/api
          git_sha: ${{ github.sha }}
          build_args: |
            BONDERY_INFRA_GIT_SHA=${{ github.sha }}
            BONDERY_INFRA_VERSION=verify
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}
          cache_scope: api

  webapp-docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            webapp:
              - apps/webapp/**
              - packages/**
              - scripts/**
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.webapp
              - .github/actions/shared/**
              - .github/workflows/verify.yml
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml

      - name: Skip webapp docker build
        if: steps.filter.outputs.webapp != 'true'
        run: echo "No webapp docker paths changed — skipping build"

      - uses: ./.github/actions/shared/docker-verify-build
        if: steps.filter.outputs.webapp == 'true'
        with:
          dockerfile: apps/webapp/Dockerfile
          dockerignore_file: .dockerignore.webapp
          image_name: ghcr.io/usebondery/webapp
          git_sha: ${{ github.sha }}
          build_args: |
            BONDERY_INFRA_GIT_SHA=${{ github.sha }}
            BONDERY_INFRA_VERSION=verify
          turbo_token: ${{ secrets.BONDERY_OPS_TURBO_TOKEN }}
          turbo_team: ${{ vars.BONDERY_OPS_TURBO_TEAM }}
          cache_scope: webapp
