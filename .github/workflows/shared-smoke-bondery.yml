name: Shared - Bondery release smoke

# Smokes the whole release: api and webapp at one tag, behind a real Traefik. A release is one
# unit, so no component is smoked or promoted alone.

on:
  workflow_call:
    inputs:
      image_tag:
        description: Tag of both images to pull and test (X.Y.Z, or sha-<short> for an RC cut)
        required: true
        type: string
      api_image_name:
        description: GHCR api image name (without tag)
        required: false
        type: string
        default: ghcr.io/usebondery/api
      webapp_image_name:
        description: GHCR webapp image name (without tag)
        required: false
        type: string
        default: ghcr.io/usebondery/webapp
      checkout_ref:
        description: Git ref for compose/scripts at release commit
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  smoke:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.3.1

      - name: Ensure Compose plugin supports pre_start (2.38+)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v5.3.1/docker-compose-linux-$(uname -m)" \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Ensure dokploy-network exists
        run: docker network create dokploy-network || true

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Fetch Infisical staging secrets
        uses: ./.github/actions/shared/infisical-staging-secrets

      - name: Run release smoke
        run: |
          node deploy/bondery/scripts/smoke-release.mjs \
            --tag "${{ inputs.image_tag }}" \
            --api-image "${{ inputs.api_image_name }}" \
            --webapp-image "${{ inputs.webapp_image_name }}"
