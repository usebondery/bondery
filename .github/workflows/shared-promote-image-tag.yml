name: Shared - Promote image tag

on:
  workflow_call:
    inputs:
      image_name:
        description: GHCR image name (without tag)
        required: true
        type: string
      source_tag:
        description: Existing tag to promote from (e.g. sha-abc1234)
        required: true
        type: string
      target_tag:
        description: New tag to point at the same digest
        required: true
        type: string
      extra_target_tags:
        description: Optional extra tags (newline-separated) to point at the same digest
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  pre_promote_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Verify source image exists
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "${IMAGE_NAME}:${SOURCE_TAG}" >/dev/null 2>&1; then
            echo "::error::No image at ${IMAGE_NAME}:${SOURCE_TAG} — named RC must exist on GHCR (stage-images on the RC cut), or use force_rebuild / source=tag-sha on manual release."
            exit 1
          fi
          echo "Source image ${IMAGE_NAME}:${SOURCE_TAG} exists."

  promote:
    needs: pre_promote_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Promote image tag
        env:
          EXTRA_TARGET_TAGS: ${{ inputs.extra_target_tags }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          ARGS=(-t "${IMAGE_NAME}:${TARGET_TAG}")
          while IFS= read -r tag; do
            tag=$(echo "$tag" | tr -d '[:space:]')
            if [ -n "$tag" ]; then
              ARGS+=(-t "${IMAGE_NAME}:${tag}")
            fi
          done <<< "$EXTRA_TARGET_TAGS"
          docker buildx imagetools create \
            "${ARGS[@]}" \
            "${IMAGE_NAME}:${SOURCE_TAG}"
