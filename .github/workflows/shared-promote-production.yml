name: Shared - Promote production image tag

on:
  workflow_call:
    inputs:
      image_name:
        description: GHCR image name (without tag)
        required: true
        type: string
      version:
        description: Semver tag that passed smoke (source for :production)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Promote semver tag to production and latest
        run: |
          docker buildx imagetools create \
            -t "${{ inputs.image_name }}:production" \
            -t "${{ inputs.image_name }}:latest" \
            "${{ inputs.image_name }}:${{ inputs.version }}"
