name: Stage - Images

on:
  push:
    branches:
      - main

concurrency:
  group: stage-images-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      webapp: ${{ steps.filter.outputs.webapp }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - apps/api/**
              - deploy/bondery/**
              - packages/**
              - scripts/**
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.api
              - .github/actions/shared/**
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml
            webapp:
              - apps/webapp/**
              - deploy/bondery/**
              - packages/**
              - scripts/**
              - docs/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.webapp
              - .github/actions/shared/**
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml
            website:
              - apps/website/**
              - packages/openapi-spec/**
              - docs/**
              - packages/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - turbo.json
              - .dockerignore.website
              - apps/website/Dockerfile
              - .github/actions/shared/**
              - .github/workflows/stage-images.yml
              - .github/workflows/shared-docker-build-push.yml
              - deploy/ops/**

  resolve:
    runs-on: ubuntu-latest
    outputs:
      infra_version: ${{ steps.pkg.outputs.infra_version }}
      is_rc: ${{ steps.pkg.outputs.is_rc }}
      is_rc_cut: ${{ steps.pkg.outputs.is_rc_cut }}
      npm_version: ${{ steps.pkg.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve package channel
        id: pkg
        run: |
          set -euo pipefail
          NPM_VERSION=$(node -p "require('./package.json').version")
          echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "infra_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"

          if echo "$NPM_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

          PREV=""
          if git cat-file -e "HEAD~1:package.json" 2>/dev/null; then
            PREV=$(git show HEAD~1:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version||''))")
          fi
          if echo "$NPM_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$' && [ "$NPM_VERSION" != "$PREV" ]; then
            echo "is_rc_cut=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc_cut=false" >> "$GITHUB_OUTPUT"
          fi

  build_api:
    needs: [detect_changes, resolve]
    if: needs.detect_changes.outputs.api == 'true'
    uses: ./.github/workflows/shared-docker-build-push.yml
    secrets: inherit
    with:
      dockerfile: apps/api/Dockerfile
      dockerignore_file: .dockerignore.api
      image_name: ghcr.io/usebondery/api
      docker_tags: |
        type=sha,prefix=sha-,format=short
        type=raw,value=beta,enable=${{ needs.resolve.outputs.is_rc_cut == 'true' }}
        type=raw,value=${{ needs.resolve.outputs.npm_version }},enable=${{ needs.resolve.outputs.is_rc_cut == 'true' }}
      oci_title: Bondery API
      oci_description: Bondery API server (integration builds from main)
      oci_documentation: https://github.com/usebondery/bondery/blob/main/docs/deploy/api-container.md
      oci_version: ${{ needs.resolve.outputs.infra_version }}
      git_sha: ${{ github.sha }}
      cache_scope: api
      build_args: |
        BONDERY_INFRA_GIT_SHA=${{ github.sha }}
        BONDERY_INFRA_VERSION=${{ needs.resolve.outputs.infra_version }}

  build_webapp:
    needs: [detect_changes, resolve]
    if: needs.detect_changes.outputs.webapp == 'true'
    uses: ./.github/workflows/shared-docker-build-push.yml
    secrets: inherit
    with:
      dockerfile: apps/webapp/Dockerfile
      dockerignore_file: .dockerignore.webapp
      image_name: ghcr.io/usebondery/webapp
      docker_tags: |
        type=sha,prefix=sha-,format=short
        type=raw,value=beta,enable=${{ needs.resolve.outputs.is_rc_cut == 'true' }}
        type=raw,value=${{ needs.resolve.outputs.npm_version }},enable=${{ needs.resolve.outputs.is_rc_cut == 'true' }}
      oci_title: Bondery Webapp
      oci_description: Bondery webapp (integration builds from main)
      oci_documentation: https://github.com/usebondery/bondery/blob/main/docs/deploy/dokploy.md
      oci_version: ${{ needs.resolve.outputs.infra_version }}
      git_sha: ${{ github.sha }}
      cache_scope: webapp
      build_args: |
        BONDERY_INFRA_GIT_SHA=${{ github.sha }}
        BONDERY_INFRA_VERSION=${{ needs.resolve.outputs.infra_version }}

  build_website:
    needs: [detect_changes, resolve]
    if: needs.detect_changes.outputs.website == 'true'
    uses: ./.github/workflows/shared-docker-build-push.yml
    secrets: inherit
    with:
      dockerfile: apps/website/Dockerfile
      dockerignore_file: .dockerignore.website
      image_name: ghcr.io/usebondery/website
      docker_tags: |
        type=sha,prefix=sha-,format=short
        type=raw,value=beta,enable=${{ needs.resolve.outputs.is_rc_cut == 'true' }}
        type=raw,value=${{ needs.resolve.outputs.npm_version }},enable=${{ needs.resolve.outputs.is_rc_cut == 'true' }}
      oci_title: Bondery Website
      oci_description: Bondery marketing website (main integration builds)
      oci_documentation: https://github.com/usebondery/bondery/blob/main/docs/deploy/dokploy.md
      oci_version: ${{ needs.resolve.outputs.infra_version }}
      git_sha: ${{ github.sha }}
      cache_scope: website
      build_args: |
        BONDERY_INFRA_GIT_SHA=${{ github.sha }}
        BONDERY_INFRA_VERSION=${{ needs.resolve.outputs.infra_version }}

  notify_beta_website:
    needs: [resolve, build_website]
    if: always() && needs.build_website.result == 'success' && needs.resolve.outputs.is_rc_cut == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/infisical-production-secrets

      - uses: ./.github/actions/shared/dokploy-deploy-webhook
        with:
          webhook_url: ${{ env.BONDERY_OPS_DOKPLOY_STAGING_WEBSITE_DEPLOY_WEBHOOK }}
          branch: main

  notify_beta_services:
    needs: [resolve, build_api, build_webapp]
    if: >-
      always() &&
      needs.resolve.outputs.is_rc_cut == 'true' &&
      (needs.build_api.result == 'success' || needs.build_webapp.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/infisical-production-secrets

      - uses: ./.github/actions/shared/dokploy-deploy-webhook
        with:
          webhook_url: ${{ env.BONDERY_OPS_DOKPLOY_STAGING_SERVICES_DEPLOY_WEBHOOK }}
          branch: main
