name: Deploy - Website

# Release-branch CD: push to release → promote :sha from main when available, else build → smoke → Dokploy.

on:
  push:
    branches:
      - release
    paths:
      - "apps/website/**"
      - "packages/openapi-spec/**"
      - "docs/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - "turbo.json"
      - ".dockerignore.website"
      - "apps/website/Dockerfile"
      - ".github/actions/shared/**"
      - ".github/workflows/deploy-website.yml"
      - ".github/workflows/shared-docker-build-push.yml"
      - ".github/workflows/shared-promote-image-tag.yml"
      - ".github/workflows/stage-images.yml"
      - "deploy/ops/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
      image_exists: ${{ steps.inspect.outputs.exists }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Read website package version
        id: pkg
        run: echo "version=$(node -p "require('./apps/website/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Check for staged website image
        id: inspect
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/usebondery/website:sha-${SHORT_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  promote:
    needs: resolve
    if: needs.resolve.outputs.image_exists == 'true'
    uses: ./.github/workflows/shared-promote-image-tag.yml
    secrets: inherit
    with:
      image_name: ghcr.io/usebondery/website
      source_tag: sha-${{ needs.resolve.outputs.short_sha }}
      target_tag: production
      extra_target_tags: latest

  build-push:
    needs: resolve
    if: needs.resolve.outputs.image_exists != 'true'
    uses: ./.github/workflows/shared-docker-build-push.yml
    secrets: inherit
    with:
      dockerfile: apps/website/Dockerfile
      dockerignore_file: .dockerignore.website
      image_name: ghcr.io/usebondery/website
      docker_tags: |
        type=raw,value=production
        type=raw,value=latest
        type=sha,prefix=sha-,format=short
      oci_title: Bondery Website
      oci_description: Bondery marketing website (release-branch CD)
      oci_documentation: https://github.com/usebondery/bondery/blob/main/docs/deploy/dokploy.md
      oci_version: production
      git_sha: ${{ github.sha }}
      build_args: |
        BONDERY_INFRA_GIT_SHA=${{ github.sha }}
        BONDERY_INFRA_VERSION=${{ needs.resolve.outputs.version }}

  image_ready:
    needs: [resolve, promote, build-push]
    if: ${{ always() && (needs.promote.result == 'success' || needs.build-push.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Website image ready (sha-${{ needs.resolve.outputs.short_sha }})"

  smoke:
    needs: [image_ready, promote, build-push]
    if: ${{ always() && needs.image_ready.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate compose + policy lint
        run: |
          cp deploy/ops/.env.example deploy/ops/.env
          docker compose -f deploy/ops/docker-compose.yml config >/dev/null
          node deploy/ops/scripts/check-compose.mjs

      - name: Ensure dokploy-network exists
        run: docker network create dokploy-network || true

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Start website from SHA tag
        working-directory: deploy/ops
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp .env.example .env.smoke
          printf '%s\n' \
            'BONDERY_INFRA_WEBAPP_DOMAIN=app.example-smoke.test' \
            'BONDERY_INFRA_WEBSITE_DOMAIN=www.example-smoke.test' \
            'BONDERY_INFRA_PLAUSIBLE_DOMAIN=plausible.example-smoke.test' \
            > .env.smoke
          printf '%s\n' \
            'services:' \
            '  website:' \
            "    image: ghcr.io/usebondery/website:sha-${SHORT_SHA}" \
            '    ports:' \
            '      - "26630:26630"' \
            > docker-compose.override.yml
          docker compose --env-file .env.smoke pull website
          docker compose --env-file .env.smoke up -d website

      - name: Wait for website /health/live and /health/ready
        working-directory: deploy/ops
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:26630/health/live >/dev/null \
              && curl -sf http://127.0.0.1:26630/health/ready >/dev/null; then
              echo "website healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env.smoke logs website || true
          exit 1

      - name: Smoke test API reference docs page
        run: curl -sf http://127.0.0.1:26630/docs/api/api-reference >/dev/null

      - name: Tear down
        if: always()
        working-directory: deploy/ops
        run: docker compose --env-file .env.smoke down -v || true

  notify-dokploy:
    needs: [image_ready, smoke]
    if: ${{ always() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/infisical-production-secrets

      - uses: ./.github/actions/shared/dokploy-deploy-webhook
        with:
          webhook_url: ${{ env.BONDERY_OPS_DOKPLOY_WEBSITE_DEPLOY_WEBHOOK }}
          branch: release
