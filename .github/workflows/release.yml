name: Release - Bondery

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      mode:
        description: CI failure recovery only
        required: true
        type: choice
        options:
          - retry-promote
      version:
        description: Product version X.Y.Z (must match root package.json and existing v tag)
        required: true
        type: string
      ref:
        description: Optional git ref to checkout (default release branch HEAD)
        required: false
        type: string
        default: ""
      components:
        description: Components to retry
        required: true
        type: choice
        options:
          - all
          - api
          - webapp
          - extension
          - api+webapp
        default: all
      force_rebuild:
        description: Rebuild Docker images from source instead of promoting the last named RC
        required: false
        type: boolean
        default: false
      source:
        description: Promote source when not rebuild (rc = last named RC digest; tag-sha = this tag/ref :sha-*)
        required: false
        type: choice
        options:
          - rc
          - tag-sha
        default: rc
      note:
        description: Optional CI incident note appended to the GitHub release
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-rc.')
    uses: ./.github/workflows/shared-release-validate.yml
    with:
      release_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != '' && inputs.mode || 'release' }}
      dispatch_version: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.version || '' }}

  detect_changes:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set.outputs.api }}
      webapp: ${{ steps.set.outputs.webapp }}
      extension: ${{ steps.set.outputs.extension }}
    steps:
      - name: Resolve component flags
        id: set
        env:
          COMPONENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.components != '' && inputs.components || '' }}
        run: |
          if [ -n "$COMPONENTS" ]; then
            case "$COMPONENTS" in
              all)
                echo "api=true" >> "$GITHUB_OUTPUT"
                echo "webapp=true" >> "$GITHUB_OUTPUT"
                echo "extension=true" >> "$GITHUB_OUTPUT"
                ;;
              api)
                echo "api=true" >> "$GITHUB_OUTPUT"
                echo "webapp=false" >> "$GITHUB_OUTPUT"
                echo "extension=false" >> "$GITHUB_OUTPUT"
                ;;
              webapp)
                echo "api=false" >> "$GITHUB_OUTPUT"
                echo "webapp=true" >> "$GITHUB_OUTPUT"
                echo "extension=false" >> "$GITHUB_OUTPUT"
                ;;
              extension)
                echo "api=false" >> "$GITHUB_OUTPUT"
                echo "webapp=false" >> "$GITHUB_OUTPUT"
                echo "extension=true" >> "$GITHUB_OUTPUT"
                ;;
              api+webapp)
                echo "api=true" >> "$GITHUB_OUTPUT"
                echo "webapp=true" >> "$GITHUB_OUTPUT"
                echo "extension=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unknown components: $COMPONENTS"
                exit 1
                ;;
            esac
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "webapp=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
          fi

  resolve_meta:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_mode: ${{ steps.source.outputs.source_mode }}
      rc_version: ${{ steps.source.outputs.rc_version }}
      rc_git_sha: ${{ steps.source.outputs.rc_git_sha }}
      drop_rc_sha: ${{ steps.source.outputs.drop_rc_sha }}
      api_digest: ${{ steps.source.outputs.api_digest }}
      webapp_digest: ${{ steps.source.outputs.webapp_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: pnpm/setup@v1
        with:
          install: false

      - name: Set up Docker Buildx
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true) }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true) }}
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Resolve promote source
        id: source
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'rc' }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true }}
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
        run: |
          set -euo pipefail
          git fetch --tags
          DROP_RC_SHA=$(git rev-parse "v${VERSION}^{}")
          echo "drop_rc_sha=${DROP_RC_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "source_mode=force_rebuild" >> "$GITHUB_OUTPUT"
            echo "source_tag=force-rebuild" >> "$GITHUB_OUTPUT"
            echo "rc_version=" >> "$GITHUB_OUTPUT"
            echo "rc_git_sha=" >> "$GITHUB_OUTPUT"
            echo "api_digest=" >> "$GITHUB_OUTPUT"
            echo "webapp_digest=" >> "$GITHUB_OUTPUT"
            echo "Incident rebuild from source; skipping RC digest resolution."
            exit 0
          fi

          if [ "$SOURCE" != "rc" ] && [ "$SOURCE" != "tag-sha" ]; then
            echo "::error::Unknown source '${SOURCE}'. Use rc or tag-sha."
            exit 1
          fi

          if [ "$SOURCE" = "tag-sha" ]; then
            if [ -n "$DISPATCH_REF" ]; then
              SHA=$(git rev-parse "${DISPATCH_REF}^{}")
            else
              SHA="$DROP_RC_SHA"
            fi
            SHORT=$(echo "$SHA" | cut -c1-7)
            SOURCE_TAG="sha-${SHORT}"
            echo "source_mode=tag-sha" >> "$GITHUB_OUTPUT"
            echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
            echo "rc_version=" >> "$GITHUB_OUTPUT"
            echo "rc_git_sha=" >> "$GITHUB_OUTPUT"
            echo "Explicit tag-sha source ${SOURCE_TAG} (${SHA})."
          else
            RC_META=$(CORE_CALVER="$VERSION" node .github/scripts/resolve-highest-rc.mjs)
            RC_VERSION=$(printf '%s\n' "$RC_META" | awk -F= '/^rc_version=/{print $2}')
            RC_GIT_SHA=$(printf '%s\n' "$RC_META" | awk -F= '/^rc_git_sha=/{print $2}')
            RC_SHORT=$(printf '%s\n' "$RC_META" | awk -F= '/^rc_git_sha_short=/{print $2}')
            SOURCE_TAG="$RC_VERSION"
            echo "source_mode=rc" >> "$GITHUB_OUTPUT"
            echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
            echo "Named RC ${RC_VERSION} freeze SHA ${RC_GIT_SHA} (sha-${RC_SHORT})."

            for svc in api webapp; do
              rc_ref="ghcr.io/usebondery/${svc}:${RC_VERSION}"
              sha_ref="ghcr.io/usebondery/${svc}:sha-${RC_SHORT}"
              rc_digest=$(bash .github/scripts/ghcr-manifest-digest.sh "$rc_ref")
              sha_digest=$(bash .github/scripts/ghcr-manifest-digest.sh "$sha_ref")
              if [ "$rc_digest" != "$sha_digest" ]; then
                echo "::error::${svc} digest mismatch: ${rc_ref} (${rc_digest}) != ${sha_ref} (${sha_digest}). Do not promote."
                exit 1
              fi
              echo "${svc}_digest=${rc_digest}" >> "$GITHUB_OUTPUT"
              echo "${svc} index digest ${rc_digest} (named RC matches RC-cut :sha)."
            done
            exit 0
          fi

          for svc in api webapp; do
            digest=$(bash .github/scripts/ghcr-manifest-digest.sh "ghcr.io/usebondery/${svc}:${SOURCE_TAG}")
            echo "${svc}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "${svc} ${SOURCE_TAG} index digest ${digest}."
          done

  github_release_init:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Create unified GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Bondery ${{ needs.validate.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: false
          body: |
            [Docs](https://usebondery.com/docs) · [Changelog](https://usebondery.com/docs/changelog)

            Release publishing in progress for ${{ needs.validate.outputs.version }}.

  release_api:
    needs: [validate, detect_changes, resolve_meta]
    if: needs.detect_changes.outputs.api == 'true'
    uses: ./.github/workflows/shared-release-container.yml
    secrets: inherit
    with:
      service: api
      version: ${{ needs.validate.outputs.version }}
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.validate.outputs.tag }}
      source_tag: ${{ needs.resolve_meta.outputs.source_tag }}
      force_rebuild: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true }}
      use_production_gate: ${{ needs.detect_changes.outputs.extension == 'true' }}

  release_webapp:
    needs: [validate, detect_changes, resolve_meta]
    if: needs.detect_changes.outputs.webapp == 'true'
    uses: ./.github/workflows/shared-release-container.yml
    secrets: inherit
    with:
      service: webapp
      version: ${{ needs.validate.outputs.version }}
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.validate.outputs.tag }}
      source_tag: ${{ needs.resolve_meta.outputs.source_tag }}
      force_rebuild: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true }}
      use_production_gate: ${{ needs.detect_changes.outputs.extension == 'true' }}

  release_extension:
    needs: [validate, detect_changes]
    if: needs.detect_changes.outputs.extension == 'true'
    uses: ./.github/workflows/shared-release-extension.yml
    secrets: inherit
    with:
      version: ${{ needs.validate.outputs.version }}
      flavor: production
      publish_cws: true

  notify_dokploy:
    needs:
      - validate
      - release_api
      - release_webapp
    if: >-
      always() &&
      (
        needs.release_api.result == 'success' ||
        needs.release_webapp.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/shared/infisical-production-secrets

      - uses: ./.github/actions/shared/dokploy-deploy-webhook
        with:
          webhook_url: ${{ env.BONDERY_OPS_DOKPLOY_SERVICES_DEPLOY_WEBHOOK }}
          branch: release

  github_release_finalize:
    needs:
      - validate
      - detect_changes
      - resolve_meta
      - release_api
      - release_webapp
      - release_extension
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_API_RESULT: ${{ needs.release_api.result }}
          RELEASE_WEBAPP_RESULT: ${{ needs.release_webapp.result }}
          EXTENSION_RESULT: ${{ needs.release_extension.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RETRY_NOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.note || '' }}
          RC_VERSION: ${{ needs.resolve_meta.outputs.rc_version }}
          RC_GIT_SHA: ${{ needs.resolve_meta.outputs.rc_git_sha }}
          DROP_RC_SHA: ${{ needs.resolve_meta.outputs.drop_rc_sha }}
          API_DIGEST: ${{ needs.resolve_meta.outputs.api_digest }}
          WEBAPP_DIGEST: ${{ needs.resolve_meta.outputs.webapp_digest }}
          SOURCE_MODE: ${{ needs.resolve_meta.outputs.source_mode }}
        run: |
          component_ok() {
            local result="$1"
            if [ "$result" = "success" ]; then
              return 0
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$result" = "skipped" ]; then
              return 0
            fi
            return 1
          }

          extension_ok() {
            if [ "$EXTENSION_RESULT" = "success" ]; then
              return 0
            fi
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$EXTENSION_RESULT" = "skipped" ]; then
              return 0
            fi
            return 1
          }

          BODY_FILE=$(mktemp)
          if component_ok "$RELEASE_API_RESULT" && \
            component_ok "$RELEASE_WEBAPP_RESULT" && \
            extension_ok; then
            cat > "$BODY_FILE" <<EOF
          [Docs](https://usebondery.com/docs) · [Changelog](https://usebondery.com/docs/changelog)

          ## Images

          - [ghcr.io/usebondery/api:${VERSION}](https://github.com/usebondery/bondery/pkgs/container/api) — \`${API_DIGEST}\`
          - [ghcr.io/usebondery/webapp:${VERSION}](https://github.com/usebondery/bondery/pkgs/container/webapp) — \`${WEBAPP_DIGEST}\`
          EOF
            if [ "$SOURCE_MODE" = "rc" ] && [ -n "$RC_VERSION" ]; then
              cat >> "$BODY_FILE" <<EOF

          Promoted last named RC \`${RC_VERSION}\` (freeze SHA \`${RC_GIT_SHA}\`).
          Drop-rc git tag SHA \`${DROP_RC_SHA}\` is changelog, package.json, and CWS only — not the container source.
          EOF
            elif [ "$SOURCE_MODE" = "tag-sha" ]; then
              cat >> "$BODY_FILE" <<EOF

          Promoted \`:sha\` of git tag SHA \`${DROP_RC_SHA}\` (explicit \`source: tag-sha\`; no named RC).
          EOF
            elif [ "$SOURCE_MODE" = "force_rebuild" ]; then
              cat >> "$BODY_FILE" <<EOF

          Images rebuilt from source (\`force_rebuild\`).
          EOF
            fi
            cat >> "$BODY_FILE" <<EOF

          Chrome extension rebuilt at GA; website rebuilt for changelog.

          ## What's new?

          [Changelog ${VERSION}](https://usebondery.com/docs/changelog/releases/${VERSION})
          EOF
            if [ -n "$RETRY_NOTE" ]; then
              printf '\n%s\n' "$RETRY_NOTE" >> "$BODY_FILE"
            fi
            gh release edit "$TAG" --notes-file "$BODY_FILE" --draft=false --prerelease=false

            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/reactions" -f content=heart
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/reactions" -f content=hooray
          else
            cat > "$BODY_FILE" <<EOF
          [Docs](https://usebondery.com/docs) · [Changelog](https://usebondery.com/docs/changelog)

          Release publishing did not finish. Do not pin this version. Stay on your current pin.
          EOF
            if [ -n "$RETRY_NOTE" ]; then
              printf '\n%s\n' "$RETRY_NOTE" >> "$BODY_FILE"
            fi
            gh release edit "$TAG" --notes-file "$BODY_FILE" --draft
          fi
