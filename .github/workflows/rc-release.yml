name: Release - RC

on:
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate RC tag and package.json
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'; then
            echo "Invalid RC tag: $TAG"
            echo "Expected format: vX.Y.Z-rc.N (N >= 1)"
            exit 1
          fi
          VERSION="${TAG#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$ROOT_VERSION" != "$VERSION" ]; then
            echo "root package.json version ($ROOT_VERSION) must equal RC tag ($VERSION)"
            exit 1
          fi
          # Peel annotated tags to the commit SHA that stage-images tagged as :sha-<short>.
          COMMIT_SHA=$(git rev-parse "${TAG}^{}")
          SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"

  github_release_init:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Create RC GitHub prerelease (draft until zip is attached)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Bondery ${{ needs.validate.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: false
          body: |
            [Docs](https://usebondery.com/docs) · [Changelog](https://usebondery.com/docs/changelog)

            RC publishing in progress for ${{ needs.validate.outputs.version }}.

  verify_images:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: ./.github/actions/shared/ghcr-login-infisical

      - name: Verify sha, named RC, and beta digests match
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
        run: |
          set -euo pipefail
          for svc in api webapp; do
            sha_ref="ghcr.io/usebondery/${svc}:sha-${SHORT_SHA}"
            rc_ref="ghcr.io/usebondery/${svc}:${VERSION}"
            beta_ref="ghcr.io/usebondery/${svc}:beta"
            sha_digest=$(bash .github/scripts/ghcr-manifest-digest.sh "$sha_ref")
            rc_digest=$(bash .github/scripts/ghcr-manifest-digest.sh "$rc_ref")
            beta_digest=$(bash .github/scripts/ghcr-manifest-digest.sh "$beta_ref")
            if [ "$sha_digest" != "$rc_digest" ] || [ "$sha_digest" != "$beta_digest" ]; then
              echo "::error::${svc} digest mismatch (tag on wrong commit?). Do not retag."
              echo "  ${sha_ref}  ${sha_digest}"
              echo "  ${rc_ref}   ${rc_digest}"
              echo "  ${beta_ref} ${beta_digest}"
              exit 1
            fi
            echo "${svc}: sha / ${VERSION} / beta share index digest ${sha_digest}"
          done

  release_extension:
    needs: [validate]
    uses: ./.github/workflows/shared-release-extension.yml
    secrets: inherit
    with:
      version: ${{ needs.validate.outputs.version }}
      flavor: staging
      publish_cws: false
      git_sha: ${{ needs.validate.outputs.short_sha }}

  github_release_finalize:
    needs:
      - validate
      - verify_images
      - release_extension
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.release_extension.result == 'success'
        with:
          name: extension-zip
          path: .

      - name: Finalize GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT_SHA: ${{ needs.validate.outputs.short_sha }}
          EXTENSION_RESULT: ${{ needs.release_extension.result }}
          VERIFY_RESULT: ${{ needs.verify_images.result }}
          ZIP_NAME: bondery-extension-${{ needs.validate.outputs.version }}-sha-${{ needs.validate.outputs.short_sha }}.zip
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          if [ "$VERIFY_RESULT" = "success" ] && [ "$EXTENSION_RESULT" = "success" ]; then
            cat > "$BODY_FILE" <<EOF
          [Docs](https://usebondery.com/docs) · [Changelog](https://usebondery.com/docs/changelog)

          ## Beta / RC

          - Verified \`ghcr.io/usebondery/{api,webapp}:sha-${SHORT_SHA}\`, \`:${VERSION}\`, and \`:beta\` share one digest (tag did not retag images)
          - Staging extension zip attached (Load unpacked; disable the Chrome Web Store listing first)
          EOF
            if [ -f "$ZIP_NAME" ]; then
              gh release upload "$TAG" "$ZIP_NAME" --clobber
            else
              echo "Expected zip $ZIP_NAME was not downloaded"
              ls -la
              exit 1
            fi
            gh release edit "$TAG" --notes-file "$BODY_FILE" --draft=false --prerelease=true
          else
            cat > "$BODY_FILE" <<EOF
          [Docs](https://usebondery.com/docs) · [Changelog](https://usebondery.com/docs/changelog)

          RC publishing did not finish. This draft stays unpublished.
          EOF
            gh release edit "$TAG" --notes-file "$BODY_FILE" --draft --prerelease=true
          fi
