# Bondery ops stack: marketing website (production + beta).
# Not for self-hosters — product stack is deploy/bondery (api + webapp + redis).
#
# Prerequisite (Traefik / Dokploy): docker network create dokploy-network
# Host-port smoke (no Traefik): copy docker-compose.override.yml.example → docker-compose.override.yml
#
# Image tag defaults to floating :production (release-branch CD). Pin via
# BONDERY_INFRA_WEBSITE_IMAGE_TAG for reproducible deploys / rollback.
#
# Traefik router names and the Docker DNS alias come from
# BONDERY_INFRA_TRAEFIK_PREFIX so production and beta can share dokploy-network.

services:
  website:
    environment:
      BONDERY_PUBLIC_API_URL: https://${BONDERY_INFRA_API_DOMAIN:?BONDERY_INFRA_API_DOMAIN must be set}
      BONDERY_PUBLIC_PLAUSIBLE_DOMAIN: ${BONDERY_INFRA_WEBSITE_DOMAIN:?BONDERY_INFRA_WEBSITE_DOMAIN must be set}
      BONDERY_PUBLIC_PLAUSIBLE_HOST: https://${BONDERY_INFRA_PLAUSIBLE_DOMAIN:?BONDERY_INFRA_PLAUSIBLE_DOMAIN must be set}
      BONDERY_PUBLIC_WEBAPP_URL: https://${BONDERY_INFRA_WEBAPP_DOMAIN:?BONDERY_INFRA_WEBAPP_DOMAIN must be set}
      BONDERY_PUBLIC_WEBSITE_URL: https://${BONDERY_INFRA_WEBSITE_DOMAIN:?BONDERY_INFRA_WEBSITE_DOMAIN must be set}
      BONDERY_INFRA_GIT_SHA: ${BONDERY_INFRA_GIT_SHA:-}
      BONDERY_INFRA_VERSION: ${BONDERY_INFRA_VERSION:-}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:26630/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      timeout: 5s
    image: ghcr.io/usebondery/website:${BONDERY_INFRA_WEBSITE_IMAGE_TAG:-production}
    pull_policy: always
    labels:
      - traefik.enable=true
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website.rule=Host(`${BONDERY_INFRA_WEBSITE_DOMAIN:?BONDERY_INFRA_WEBSITE_DOMAIN must be set}`)"
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website.entrypoints=websecure"
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website.tls.certResolver=letsencrypt"
      - "traefik.http.routers.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website.service=${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website"
      - "traefik.http.services.${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website.loadbalancer.server.port=26630"
    networks:
      dokploy-network:
        aliases:
          - ${BONDERY_INFRA_TRAEFIK_PREFIX:-bondery}-website
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
