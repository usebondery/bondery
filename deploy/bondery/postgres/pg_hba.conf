# Client authentication for the bundled Postgres (see docs/deploy/configuration.mdx#postgres-tls).
#
# Postgres reads this file through `-c hba_file=` (deploy/bondery/postgres/entrypoint.sh), so it
# also applies to installs whose data volume still holds the pg_hba.conf written at initdb.
#
# - Unix socket, inside the container only: the healthcheck, initdb, and
#   `docker compose exec db pg_dump|psql` backups and restores.
# - TCP: TLS with a SCRAM password, from any address. Postgres is published on host loopback
#   only (SSH tunnels) and otherwise reachable only on the private Compose network.
# - TCP without TLS: rejected.
#
# TYPE    DATABASE USER ADDRESS    METHOD
local     all      all             trust
hostssl   all      all  0.0.0.0/0  scram-sha-256
hostssl   all      all  ::/0       scram-sha-256
hostnossl all      all  0.0.0.0/0  reject
hostnossl all      all  ::/0       reject
