# Bondery behind nginx on the same host, without Traefik (docs/deploy/reverse-proxy.mdx).
# Use it with docker-compose.override.yml.example, which binds every stack port to 127.0.0.1.
# Include it from the http {} block of nginx.conf.
#
# 1. Replace api.example.com, app.example.com, and storage.example.com with your
#    BONDERY_INFRA_*_DOMAIN values, and bondery-api / bondery-storage with
#    <BONDERY_INFRA_TRAEFIK_PREFIX>-api / -storage if you changed the prefix.
# 2. Get public certificates for the three domains (for example with certbot).
# 3. Export the private CAs (again after replacing a CA):
#      sh deploy/bondery/scripts/api-ca.sh > /etc/nginx/bondery-api-ca.crt
#      sh deploy/bondery/scripts/storage-ca.sh > /etc/nginx/bondery-storage-ca.crt

map $http_upgrade $bondery_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name api.example.com app.example.com storage.example.com;
    return 301 https://$host$request_uri;
}

# API: HTTPS to the API, WebSocket sync included, verified against the API CA.
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # The largest upload the API accepts (Bondery, LinkedIn, and contact imports).
    client_max_body_size 100m;

    location / {
        proxy_pass https://127.0.0.1:26642;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/bondery-api-ca.crt;
        proxy_ssl_name bondery-api;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client address only: the API rate-limits by it, so a visitor's own header must not pass.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bondery_connection_upgrade;
    }
}

# Webapp: plain HTTP on 127.0.0.1 only, so this hop never leaves the host.
server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:26632;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The client address only: the API rate-limits by it, so a visitor's own header must not pass.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Storage: public reads only, without cookies or credentials, verified against the storage CA.
server {
    listen 443 ssl;
    http2 on;
    server_name storage.example.com;
    ssl_certificate     /etc/letsencrypt/live/storage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.example.com/privkey.pem;

    location / {
        limit_except GET HEAD OPTIONS {
            deny all;
        }
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/bondery-storage-ca.crt;
        proxy_ssl_name bondery-storage;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.3;

        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
}
