packages:
  - apps/*
  - packages/*

# Pin pnpm via packageManager + CI/Docker, not the lockfile env document.
# pnpm 12 records packageManagerDependencies by default, which makes
# verify-deps-before-run treat a fresh install as stale on every `pnpm run`.
# https://pnpm.io/lockfile
pmOnFail: ignore
verifyDepsBeforeRun: false
# Node comes from nvm/.nvmrc, pnpm/setup, and Docker node:26-slim.
# Recording `node@runtime` in the lockfile breaks turbo-prune then `pnpm prune`.
runtime: false
runtimeOnFail: ignore

nodeLinker: hoisted
autoInstallPeers: true
linkWorkspacePackages: true
preferWorkspacePackages: true
saveWorkspaceProtocol: rolling
enableGlobalVirtualStore: true
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
  - compile

overrides:
  "@better-auth/core": "1.7.7"
  "@react-email/ui": "6.11.0"
  "@types/node": "26.6.3"
  "@vitejs/plugin-react": "6.1.1"
  react: "19.3.0"
  react-dom: "19.3.0"
  react-is: "19.3.0"
  react-email: "6.11.0"
  tsx: "4.23.15"
  "@tiptap/core": "3.31.4"
  "@tiptap/extension-bubble-menu": "3.31.4"
  "@tiptap/extension-color": "3.31.4"
  "@tiptap/extension-emoji": "3.31.4"
  "@tiptap/extension-floating-menu": "3.31.4"
  "@tiptap/extension-highlight": "3.31.4"
  "@tiptap/extension-link": "3.31.4"
  "@tiptap/extension-list": "3.31.4"
  "@tiptap/extension-mention": "3.31.4"
  "@tiptap/extension-placeholder": "3.31.4"
  "@tiptap/extension-task-item": "3.31.4"
  "@tiptap/extension-task-list": "3.31.4"
  "@tiptap/extension-text-style": "3.31.4"
  "@tiptap/extensions": "3.31.4"
  "@tiptap/pm": "3.31.4"
  "@tiptap/react": "3.31.4"
  "@tiptap/starter-kit": "3.31.4"
  "@tiptap/suggestion": "3.31.4"
  next: "16.3.8"
  postcss: "^8.5.28"
  rolldown: "1.2.7"
  esbuild: "0.28.2"
  zod-openapi: "^6.0.2"

allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  core-js-pure: true
  core-js: true
  esbuild: true
  lefthook: true
  prisma: true
  protobufjs: true
  react-native-enriched-markdown: true
  sharp: true
  spawn-sync: true
minimumReleaseAge: 0
